name: build-main

on:
  push:
    branches: [main]

# CPC compiles two engine modules in rather than requiring them as installs, so
# the build needs them present before it starts. They are published to no Maven
# repository on purpose: a core that a user could download separately is a core
# two plugins can disagree about the version of. They are built here from their
# own tagged sources instead, chassis first.
#
# The tags are pinned, not floating. A moving ref would mean this workflow could
# start producing a different jar from the same CPC commit, which is exactly the
# provenance claim a released, DOI-archived plugin is making.
env:
  OC3D_CORE_TAG: v0.1.0
  CPC_CORE_TAG: v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'zulu'
      - name: Cache Maven repo
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Check out oc3d-core
        uses: actions/checkout@v7
        with:
          repository: Jay2owe/oc3d-core
          ref: ${{ env.OC3D_CORE_TAG }}
          path: .cores/oc3d-core
      - name: Check out cpc-core
        uses: actions/checkout@v7
        with:
          repository: Jay2owe/cpc-core
          ref: ${{ env.CPC_CORE_TAG }}
          path: .cores/cpc-core

      # Chassis first: cpc-core compiles against oc3d-core.
      - name: Install oc3d-core
        run: mvn -B -DskipTests install
        working-directory: .cores/oc3d-core
      - name: Install cpc-core
        run: mvn -B -DskipTests install
        working-directory: .cores/cpc-core

      - name: Build
        run: bash mvnw clean package
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: CPC-jar
          path: target/CPC-*.jar
