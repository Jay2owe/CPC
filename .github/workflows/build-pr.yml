name: build-pr

on:
  pull_request:
    branches: [main]

# See build-main.yml: the engine modules are compiled in, published nowhere, and
# built here from their own tagged sources. Chassis first.
env:
  OC3D_CORE_TAG: v0.1.0
  CPC_CORE_TAG: v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Check out oc3d-core
        uses: actions/checkout@v4
        with:
          repository: Jay2owe/oc3d-core
          ref: ${{ env.OC3D_CORE_TAG }}
          path: .cores/oc3d-core
      - name: Check out cpc-core
        uses: actions/checkout@v4
        with:
          repository: Jay2owe/cpc-core
          ref: ${{ env.CPC_CORE_TAG }}
          path: .cores/cpc-core

      - name: Install oc3d-core
        run: mvn -B -DskipTests install
        working-directory: .cores/oc3d-core
      - name: Install cpc-core
        run: mvn -B -DskipTests install
        working-directory: .cores/cpc-core

      - name: Build
        run: bash mvnw clean package
